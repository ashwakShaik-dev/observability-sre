alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "host.docker.internal:9093"

global:
  scrape_interval: 5s

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "sre-monitoring-app"
    static_configs:
      - targets: ["host.docker.internal:5000"]