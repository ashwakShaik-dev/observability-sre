name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ashwak95/observability-sre

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Checkout GitOps config repository
        uses: actions/checkout@v6
        with:
          repository: ashwakShaik-dev/observability-sre-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config-repo

      - name: Update image tag
        working-directory: config-repo
        run: |
          sed -i "s|image: .*|image: ${IMAGE_NAME}:${{ github.sha }}|" k8s/app.yaml

      - name: Commit and push GitOps change
        working-directory: config-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push